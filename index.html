<!doctype html>
<html lang="es" class="scroll-smooth">

    <meta name="theme-color" content="#070a12" />

    <meta name="twitter:card" content="summary_large_image" />

    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      />
